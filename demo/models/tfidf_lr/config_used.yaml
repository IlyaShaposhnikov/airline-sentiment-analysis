data:
  confidence_columns:
    reason: negativereason_confidence
    sentiment: airline_sentiment_confidence
  confidence_threshold: 0.7
  path: data/Tweets.csv
  target_column: airline_sentiment
  text_column: text
evaluation:
  metrics:
    primary:
    - accuracy
    - f1_macro
    - f1_weighted
    - roc_auc_ovo
  reporting:
    export_formats:
    - json
    - csv
    include_classification_report: true
    include_confusion_matrix: true
    misclassified_examples:
      include_text: true
      n_top: 10
    plot_settings:
      cmap: Blues
      figsize:
      - 8
      - 6
      normalize: true
  split:
    stratify: true
    test_size: 0.25
interpretability:
  plot_settings:
    figsize:
    - 10
    - 8
    horizontal: true
  shap:
    background_samples: 100
    enabled: false
    random_state: 42
  weight_based:
    n_top_features: 20
    top_words_threshold: 2.0
model:
  artifacts:
    auto_save: true
    path: artifacts/model_bundle.joblib
  regularization:
    C: 1.0
    l1_ratio: 0.5
    penalty: l2
    solver: lbfgs
  training:
    class_weight: balanced
    max_iter: 500
    random_state: 42
    use_confidence_weights: true
  type: logistic_regression
preprocessing:
  cleaning:
    lowercase: true
    remove_extra_whitespace: true
    remove_mentions: true
    remove_special_chars: true
    remove_urls: true
  nlp:
    lemmatize: false
    remove_stopwords: false
  vectorizer:
    lowercase: true
    max_features: 2000
    ngram_range:
    - 1
    - 2
    stop_words: null
    type: tfidf
serving:
  api:
    cors_origins:
    - '*'
    enabled: true
    endpoint: /predict
    host: 0.0.0.0
    limits:
      max_batch_size: 100
      max_explain_count: 20
      max_request_size_mb: 10
      max_text_length: 1000
      min_explain_count: 1
    log_level: INFO
    port: 8000
    rate_limit_per_minute: 60
  dashboard:
    enabled: false
    framework: streamlit
    title: Airline Sentiment Predictor
